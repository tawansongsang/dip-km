- id: tm-registrable-conditions
  audience: public
  lang: th
  question: เครื่องหมายการค้าแบบไหนถึงจะจดทะเบียนได้
  expect_sections: ["6"]
  must_include:
    - ["บ่งเฉพาะ"]
    - ["ต้องห้าม"]
    - ["เหมือนหรือคล้าย"]
