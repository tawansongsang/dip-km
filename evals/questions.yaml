# Evaluation questions for agents answering from knowledge/.
#
# Fields:
#   id                 unique slug
#   audience           public | staff  (how the question is phrased)
#   lang               th | en
#   question           exactly what the user types
#   expect_sections    มาตรา / ข้อ the answer must cite (Arabic digits, "79/4", "28 ทวิ")
#   must_include       list of facts; each fact is a list of accepted spellings,
#                      any one is enough. Thai digits and thousands separators
#                      are normalized before matching.
#   must_not_include   phrases that indicate a wrong answer
#   expect_not_found   true when the knowledge base does not have the answer
#                      and the agent must say so instead of answering from memory
#   source             file(s) holding the ground truth, for reviewers
#
# Ground truth: Trademark Act B.E. 2534 as amended to No. 3 (2559); travel
# expenses: Royal Decree B.E. 2526 (to No. 9, 2560) and MOF Regulation
# B.E. 2550 as amended by No. 2 (2554); Copyright Act B.E. 2537 as amended
# to No. 5 (2565), consolidated by DIP.

# --- what can be registered ------------------------------------------------

- id: tm-def-sound
