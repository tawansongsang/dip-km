[tools]
python = "3.14"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install pipeline dependencies into .venv"
run = "pip install -r pipeline/requirements.txt"

[tasks.extract]
description = "Dump cleaned full text of a Krisdika PDF: mise run extract <pdf> <out.md>"
run = "python pipeline/extract_krisdika.py"

[tasks."build:tm-act"]
description = "Build knowledge files for the Trademark Act B.E. 2534"
run = """
rm -rf knowledge/public/trademark/act-2534
python pipeline/build_act.py raw/trademark/act_tm_th_2534.pdf \
  knowledge/public/trademark/act-2534 \
  --id tm-act-2534 --title-en "Trademark Act B.E. 2534 (1991)"
"""

[tasks.build]
description = "Rebuild all generated knowledge files"
depends = ["build:*"]

[tasks.eval]
description = "Run eval questions through an agent: mise run eval -- --agent claude|codex [--only id,id]"
run = "python evals/run.py run"

[tasks."eval:grade"]
description = "Regrade a saved eval run: mise run eval:grade <evals/results/run-dir>"
run = "python evals/run.py grade"

[tasks."skills:sync"]
description = "Copy .agents/skills/ to .claude/skills/ (no symlinks, works on Windows)"
run = "python scripts/sync_skills.py"

[tasks."skills:check"]
description = "Fail if .claude/skills/ is out of date with .agents/skills/"
run = "python scripts/sync_skills.py --check"
